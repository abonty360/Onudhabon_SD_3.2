name: CI/CD Pipeline

on:
  push:
    branches:
      - feat/deploy
      - main
  pull_request:
    branches:
      - feat/deploy
      - main
  workflow_dispatch:

jobs:
  # =========================================================
  # 1. Build and compile .NET application
  # =========================================================
  build-and-verify:
    name: Build & Verify .NET Solution
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet Packages
        run: dotnet restore Onudhabon.csproj

      - name: Build Project (Release Configuration)
        run: dotnet build Onudhabon.csproj -c Release --no-restore

  # =========================================================
  # 2. Build Docker Container Image
  # =========================================================
  docker-build:
    name: Build Docker Container
    runs-on: ubuntu-latest
    needs: build-and-verify

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: onudhabon:latest

  # =========================================================
  # 3. Optional Automated Deployment to Render
  # =========================================================
  deploy-to-render:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [build-and-verify, docker-build]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/feat/deploy' || github.ref == 'refs/heads/main')

    steps:
      - name: Trigger Render Deploy Hook
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Triggering Render deployment webhook..."
            curl -fsS -X POST "$RENDER_DEPLOY_HOOK"
            echo "Deployment triggered successfully on Render!"
          else
            echo "RENDER_DEPLOY_HOOK_URL secret not configured in repository."
            echo "If your Render Web Service is connected to GitHub directly, Render will automatically deploy new commits."
          fi
